# MacroscopArchiveTool: metrics of the last archive scan for Zabbix agent / agent 2 (Windows).
# Copy to zabbix_agentd.d\ (agent) or zabbix_agent2.d\ (agent 2), or add the line to the agent config, then restart the agent.
UserParameter=macroscop.metrics,type "C:\ProgramData\MacroscopArchiveTool\metrics.json"
